plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.updateblocker'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.updateblocker"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // DexKit bundles native .so files — they must be uncompressed / legacy packaged
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // LSPosed / Xposed API (compileOnly is essential - do not package into APK)
    compileOnly 'de.robv.android.xposed:api:82'

    // DexKit – runtime DEX scanner for hooking obfuscated Play Store internals
    implementation 'org.luckypray:dexkit:2.3.0'

    // AndroidX & Material UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
