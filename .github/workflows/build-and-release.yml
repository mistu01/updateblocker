name: Build & Release UpdateBlocker

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Signing Key & Sign APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          SIGNED_APK="app/build/outputs/apk/release/UpdateBlocker-release.apk"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with provided repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > custom_keystore.jks
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK.aligned"
            $BUILD_TOOLS_DIR/apksigner sign --ks custom_keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$SIGNED_APK" "$SIGNED_APK.aligned"
          else
            echo "No custom keystore secret configured. Creating CI signing key..."
            keytool -genkey -v -keystore ci_release.jks -alias updateblocker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass updateblocker -keypass updateblocker \
              -dname "CN=UpdateBlocker, OU=Dev, O=OpenSource, L=World, S=World, C=US"

            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK.aligned"
            $BUILD_TOOLS_DIR/apksigner sign --ks ci_release.jks \
              --ks-key-alias updateblocker \
              --ks-pass pass:updateblocker \
              --key-pass pass:updateblocker \
              --out "$SIGNED_APK" "$SIGNED_APK.aligned"
          fi

          # Determine release tag name
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            # Extract version from app/build.gradle
            APP_VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
            if [ -z "$APP_VER" ]; then
              APP_VER="1.0.0"
            fi
            RELEASE_TAG="v${APP_VER}"

            # Create and push git tag if it doesn't already exist
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Creating tag $RELEASE_TAG..."
              git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
              git push origin "$RELEASE_TAG" || echo "Tag push skipped or already exists on remote"
            fi
          fi

          FINAL_APK_NAME="UpdateBlocker-${RELEASE_TAG}.apk"
          cp "$SIGNED_APK" "./$FINAL_APK_NAME"
          echo "FINAL_APK_PATH=./$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpdateBlocker-APK
          path: ${{ env.FINAL_APK_PATH }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UpdateBlocker ${{ env.RELEASE_TAG }}
          files: ${{ env.FINAL_APK_PATH }}
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
