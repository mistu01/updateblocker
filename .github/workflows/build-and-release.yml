name: Build & Release UpdateBlocker

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: true
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Signing Key & Sign APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          SIGNED_APK="app/build/outputs/apk/release/UpdateBlocker-release.apk"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with provided repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > custom_keystore.jks
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK.aligned"
            $BUILD_TOOLS_DIR/apksigner sign --ks custom_keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$SIGNED_APK" "$SIGNED_APK.aligned"
          else
            echo "No custom keystore secret configured. Creating CI signing key..."
            keytool -genkey -v -keystore ci_release.jks -alias updateblocker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass updateblocker -keypass updateblocker \
              -dname "CN=UpdateBlocker, OU=Dev, O=OpenSource, L=World, S=World, C=US"

            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK.aligned"
            $BUILD_TOOLS_DIR/apksigner sign --ks ci_release.jks \
              --ks-key-alias updateblocker \
              --ks-pass pass:updateblocker \
              --key-pass pass:updateblocker \
              --out "$SIGNED_APK" "$SIGNED_APK.aligned"
          fi

          # Extract version from tag or commit
          TAG_OR_SHA="${GITHUB_REF_NAME}"
          if [ -z "$TAG_OR_SHA" ] || [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG_OR_SHA=$(git rev-parse --short HEAD)
          fi

          FINAL_APK_NAME="UpdateBlocker-${TAG_OR_SHA}.apk"
          cp "$SIGNED_APK" "./$FINAL_APK_NAME"
          echo "FINAL_APK_PATH=./$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpdateBlocker-APK
          path: ${{ env.FINAL_APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body: |
            ### 🛡️ UpdateBlocker Release

            #### 📦 Download:
            Direct installable APK attached below:
            - **${{ env.FINAL_APK_NAME }}**

            #### 🚀 Setup in LSPosed:
            1. Download and install the APK.
            2. Open **LSPosed Manager**.
            3. Enable the **UpdateBlocker** module.
            4. Recommended Scope:
               - **Google Play Store** (`com.android.vending`)
               - **System Framework** (`android`) *(optional secondary protection)*
            5. Force-stop Google Play Store (or tap **Restart Play Store** in the app).
            6. Open UpdateBlocker and choose the apps you wish to freeze from auto-updating!
